<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>El Estratega</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Estratega">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0a0b0d">
    <link rel="apple-touch-icon" href="TemplateData/icons/icon-180.png">
    <link rel="icon" href="TemplateData/icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loading">
      <img id="loading-logo" src="TemplateData/logo.png" alt="">
      <div id="loading-title">El Estratega</div>
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text">Barajando…</div>
    </div>
    <script>
      // URL del servidor de esta publicación. Se puede cambiar aquí sin recompilar.
      window.EstrategaServerUrl = "wss://estratega-server.onrender.com/ws";

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("ServiceWorker.js");
        });
      }

      // Al abrirla, la página nueva ya llega sola. Esto cubre la app que se deja abierta durante días: al volver a ella,
      // si hay otra versión, se recarga. No se pierde nada: la partida vive en el servidor y se reconecta.
      var runningBuild = "84e72c174cd8782a2afc047998121693.loader.js";
      var lastVersionCheck = Date.now();
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || Date.now() - lastVersionCheck < 60000) return;
        lastVersionCheck = Date.now();
        fetch("./?version=" + lastVersionCheck, { cache: "no-store" })
          .then(function (response) { return response.ok ? response.text() : ""; })
          .then(function (html) {
            if (html.indexOf("createUnityInstance") !== -1 && html.indexOf(runningBuild) === -1) location.reload();
          })
          .catch(function () {});
      });

      var loading = document.getElementById("loading");
      var bar = document.getElementById("loading-bar");
      var text = document.getElementById("loading-text");

      function showError(message) {
        text.textContent = "No se ha podido cargar. Cierra y vuelve a abrir. (" + message + ")";
        loading.style.display = "flex";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/81e0b8cdc8db973a147c8dd7cdf34155.data.unityweb",
        frameworkUrl: buildUrl + "/e5fcec2978ab1df5ff8503bbc0930277.framework.js.unityweb",
        codeUrl: buildUrl + "/be1ad51f0bb6df50dcd8ad6e510bfc1c.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Vixtorbir",
        productName: "El Estratega",
        productVersion: "0.1.0",
        // Sin pasar de 2x: a la resolución nativa del iPhone gastaría más memoria y batería sin verse mejor.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) {
          if (type === "error") showError(message);
          else console.warn(message);
        }
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/84e72c174cd8782a2afc047998121693.loader.js";
      script.onload = function () {
        createUnityInstance(document.getElementById("game"), config, function (progress) {
          bar.style.width = (100 * progress) + "%";
          text.textContent = "Barajando… " + Math.round(100 * progress) + " %";
        }).then(function () {
          loading.style.display = "none";
        }).catch(showError);
      };
      script.onerror = function () { showError("sin conexión"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
